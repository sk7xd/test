name: Sync to Hugging Face Space

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Check secrets are visible
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PING_TEST: ${{ secrets.PING_TEST }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "HF_TOKEN is EMPTY or not set for this repo/workflow."
          else
            echo "HF_TOKEN is set, length: ${#HF_TOKEN}"
          fi
          if [ -z "$PING_TEST" ]; then
            echo "PING_TEST is EMPTY or not set for this repo/workflow."
          else
            echo "PING_TEST is set, length: ${#PING_TEST}"
          fi

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git remote add space https://pbkarthi:${HF_TOKEN}@huggingface.co/spaces/pbkarthi/qwentest
          git push --force space HEAD:main
